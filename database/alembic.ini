# Alembic config for the Placed database. Paths are relative to this file so it
# works from any cwd, locally (database/alembic.ini) and in the Docker image
# (/app/database/alembic.ini).
#
#   cd backend && PYTHONPATH=..:. .venv/bin/alembic -c ../database/alembic.ini <command>
#
# The database URL is not set here: env.py reads database.db.DATABASE_URL
# (i.e. the DATABASE_URL env var, defaulting to sqlite:///./placement_prep.db).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
