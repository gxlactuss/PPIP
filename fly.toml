app = "placementprep-api"
primary_region = "bom"

[build]

[env]
  DATABASE_URL = "sqlite:////data/placement_prep.db"
  GEMINI_MODEL = "gemini-flash-latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "placementprep_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
