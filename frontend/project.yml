name: PlacementPrep

options:
  bundleIdPrefix: com.placementprep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PlacementPrep:
    type: application
    platform: auto
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: PlacementPrep
        excludes:
          - "Resources/Info.plist"
          - "Resources/PlacementPrep.entitlements"
          - "Resources/Companies"
          - "Resources/Quizzes"
          - "Resources/Logos"
      - path: PlacementPrep/Resources/Companies
        type: folder
      - path: PlacementPrep/Resources/Quizzes
        type: folder
      - path: PlacementPrep/Resources/Logos
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.placementprep.app
        PRODUCT_NAME: PlacementPrep
        INFOPLIST_FILE: PlacementPrep/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PlacementPrep/Resources/PlacementPrep.entitlements
        "CODE_SIGN_STYLE[sdk=macosx*]": Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        TARGETED_DEVICE_FAMILY: "1,2"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconTier2 AppIconTier3 AppIconTier4 AppIconTier5 AppIconTier6"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES

schemes:
  PlacementPrep:
    build:
      targets:
        PlacementPrep: all
    run:
      config: Debug
    archive:
      config: Release
